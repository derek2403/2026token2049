# Workflow secret id -> env var the CLI reads it from (cre/.env in simulation).
# BASE_RPC_URL is a secret because a keyed provider URL carries its key in the path.
secretsNames:
  BASE_RPC_URL:
    - BASE_RPC_URL_ALL
  # soda-signer: Solana devnet RPC for reading the SigRequest (keyed URLs carry a key).
  SOLANA_RPC_URL:
    - SOLANA_RPC_URL_ALL
  # soda-signer: bearer token for the MPC coordinator's POST /sign.
  MPC_COORDINATOR_TOKEN:
    - MPC_COORDINATOR_TOKEN_ALL
