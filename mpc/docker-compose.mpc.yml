# Local SODA MPC stack: two mpc-node peers + one mpc-coordinator.
#
# Before first run, generate throwaway shares once (they stay out of git and
# out of every image: mpc/**/shares is in .gitignore and .dockerignore):
#
#   npm --prefix mpc install
#   npm run mpc:dkg            # writes mpc/node/shares/share-p{1,2}.json
#
# Then, from the repo root:
#
#   docker compose -f mpc/docker-compose.mpc.yml up --build
#
# Nodes only sign SigRequest accounts they can read from SOLANA_RPC_URL and
# that are owned by SODA_PROGRAM_ID, so set both (devnet soda is
# CPAEfBXpMMsUrjLNhDYxaCH79DYvFHJFC27fttnxAL1J).
#
# Health: curl http://localhost:8000/health
# Sign  : curl -XPOST http://localhost:8000/sign \
#           -H 'content-type: application/json' \
#           -d '{"sigRequestPubkey": "<SigRequest account>"}'

x-node-env: &node-env
  SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
  SODA_PROGRAM_ID: ${SODA_PROGRAM_ID:-CPAEfBXpMMsUrjLNhDYxaCH79DYvFHJFC27fttnxAL1J}
  MPC_AUTH_TOKEN: ${MPC_NODE_AUTH_TOKEN:-}

services:
  mpc-node-p1:
    build:
      context: ..
      dockerfile: mpc/node/Dockerfile
    image: soda-mpc-node:latest
    environment:
      <<: *node-env
      MPC_ROLE: p1
      MPC_SHARE_PATH: /data/share-p1.json
      PORT: 8001
    volumes:
      - ./node/shares:/data:ro
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  mpc-node-p2:
    build:
      context: ..
      dockerfile: mpc/node/Dockerfile
    image: soda-mpc-node:latest
    environment:
      <<: *node-env
      MPC_ROLE: p2
      MPC_SHARE_PATH: /data/share-p2.json
      PORT: 8002
    volumes:
      - ./node/shares:/data:ro
    ports:
      - "8002:8002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  mpc-coordinator:
    build:
      context: ..
      dockerfile: mpc/coordinator/Dockerfile
    image: soda-mpc-coordinator:latest
    environment:
      MPC_NODE_P1_URL: http://mpc-node-p1:8001
      MPC_NODE_P2_URL: http://mpc-node-p2:8002
      MPC_NODE_AUTH_TOKEN: ${MPC_NODE_AUTH_TOKEN:-}
      MPC_AUTH_TOKEN: ${MPC_AUTH_TOKEN:-}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      mpc-node-p1:
        condition: service_healthy
      mpc-node-p2:
        condition: service_healthy
    restart: unless-stopped
